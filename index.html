<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nano Sender</title>
<style>
:root { color-scheme: light; font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #192333; background: #edf1f7; }
* { box-sizing: border-box; }
body { margin: 0; }
main { max-width: 860px; margin: 0 auto; padding: 48px 24px; }
header { display: flex; gap: 14px; align-items: center; margin-bottom: 28px; }
.mark { background: #174fc3; color: white; border-radius: 12px; width: 38px; height: 46px; display: grid; place-items: center; }
.mark::before { content: ""; width: 18px; height: 29px; border: 2px solid white; border-radius: 4px; }
h1 { margin: 0; font-size: 28px; letter-spacing: -.045em; }
h2 { margin: 0 0 16px; font-size: 17px; letter-spacing: -.02em; }
nav { display: flex; gap: 4px; overflow: auto; padding: 5px; border-radius: 11px; background: #dfe6f1; margin-bottom: 16px; }
button, input, select { font: inherit; }
button { cursor: pointer; border: 1px solid #cdd7e7; border-radius: 8px; padding: 9px 13px; background: #f7f9fd; color: #192333; white-space: nowrap; }
button:hover:not(:disabled) { background: #e6efff; }
button:disabled { opacity: .47; cursor: default; }
button.primary { color: white; background: #174fc3; border-color: #174fc3; }
button.primary:hover:not(:disabled) { background: #15429b; }
nav button { border: 0; background: transparent; }
nav button[aria-selected="true"] { background: white; color: #1647a9; box-shadow: 0 1px 3px #19376323; }
section { margin-bottom: 12px; border: 1px solid #dbe3ef; border-radius: 14px; background: white; padding: 20px; }
label { display: grid; gap: 7px; color: #495976; font-size: 14px; }
input:not([type=checkbox]), select { width: 100%; border-radius: 8px; border: 1px solid #cdd7e7; padding: 9px 10px; background: #fff; color: #192333; min-width: 0; }
input[type=checkbox] { accent-color: #174fc3; }
.grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 14px; }
.row { display: flex; align-items: end; flex-wrap: wrap; gap: 8px; margin-top: 13px; }
.row label { flex: 1 1 170px; }
.check { display: flex; align-items: center; }
.hint { color: #495976; font-size: 14px; line-height: 1.4; margin: 10px 0 0; }
.status { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
#status { margin: 0; overflow-wrap: anywhere; }
#error { color: #9b2531; }
progress { width: 100%; height: 8px; accent-color: #174fc3; margin-top: 12px; }
dialog { border: 1px solid #cdd7e7; border-radius: 14px; padding: 24px; max-width: min(380px,90vw); }
dialog::backdrop { background: #17263a88; }
#code { font-size: 35px; font-variant-numeric: tabular-nums; letter-spacing: .15em; margin: 14px 0; }
[hidden] { display: none !important; }
@media(max-width: 530px) { main { padding: 25px 12px; } section { padding: 15px; } .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
<header><span class="mark" aria-hidden="true"></span><h1>Nano Sender</h1></header>
<nav id="tabs" aria-label="Transfer modes" role="tablist">
<button type="button" role="tab" data-tab="inbox" aria-selected="true">Classic Files</button>
<button type="button" role="tab" data-tab="stream" aria-selected="false">Stream</button>
<button type="button" role="tab" data-tab="youtubeAudio" aria-selected="false">YouTube Audio</button>
<button type="button" role="tab" data-tab="youtubeVideo" aria-selected="false">YouTube Streamer</button>
<button type="button" role="tab" data-tab="ble" aria-selected="false">BLE</button>
</nav>
<section id="connection">
<h2>Bluetooth Classic</h2>
<div class="grid">
<label>Nearby devices<select id="devices"><option value="">Select a device</option></select></label>
<label>Nano address<input id="address" autocomplete="off" placeholder="AA:BB:CC:DD:EE:FF"></label>
</div>
<div class="row">
<button id="scan">Find devices</button><button id="pair">Pair</button>
<button id="connect" class="primary">Connect</button><button id="disconnect">Disconnect</button>
</div>
<p class="hint" id="hint"></p>
</section>
<section id="ble-connection" hidden>
<h2>Bluetooth LE</h2>
<p id="ble-hint" class="hint">In Bluetooth Test, scan for Nano UART and connect.</p>
<div class="row">
<label>Message<input id="message" maxlength="20" placeholder="Hello from the Pi"></label>
<button id="send-message">Send message</button>
</div>
</section>
<section id="media">
<h2>Media</h2>
<div class="grid">
<label id="destination-row">Nano app<select id="destination"><option value="inbox">Bluetooth Test</option><option value="video">VideoStream</option></select></label>
<label>Audio quality<select id="audio"><option value="low">Low (7.35 kHz mono)</option><option value="medium">Medium (11.025 kHz mono)</option><option value="high">High (22.05 kHz mono)</option><option value="fullMono">Full (44.1 kHz mono)</option><option value="fullStereo">Full (44.1 kHz stereo)</option></select></label>
<label id="quality-row" hidden>Video quality<select id="quality"><option value="low">Low</option><option value="balanced" selected>Balanced</option><option value="high">High</option><option value="double">Double</option></select></label>
<label id="fps-row" hidden>Frame rate<select id="fps"><option>5</option><option>10</option><option>15</option><option>30</option></select></label>
<label id="playback-row" hidden>Start playback<select id="playback"><option value="after">After transfer</option><option value="live">While sending</option></select></label>
<label id="transport-row" hidden>BLE audio transport<select id="transport"><option value="read">GATT Read</option><option value="notify">Notifications</option><option value="fast">Fast Notifications</option></select></label>
<label id="convert-row" class="check" hidden><input type="checkbox" id="convert"> Convert during transfer</label>
<label id="autoplay-row" class="check" hidden><input type="checkbox" id="autoplay"> Start playing on receive</label>
</div>
<form id="file-form" class="row"><label id="file-label">File<input type="file" id="file" required></label><button id="send-file" class="primary">Send file</button></form>
<form id="link-form" class="row" hidden><label>YouTube link<input id="link" placeholder="https://youtu.be/…" required></label><button id="send-link" class="primary">Send link</button></form>
<form id="search-form" class="row" hidden><label>Search YouTube<input id="query" maxlength="200" required></label><button id="search" class="primary">Search</button></form>
</section>
<section>
<div class="status"><p id="status" role="status">Starting Nano Sender…</p><button id="cancel" hidden>Cancel</button></div>
<progress id="progress" max="100" hidden></progress>
<p id="error" class="hint" role="alert" hidden></p>
</section>
</main>
<dialog id="pair-dialog">
<h2>Confirm Bluetooth pairing</h2>
<p class="hint">Check that this code matches the one on the Nano.</p>
<p id="code"></p>
<div class="row"><button id="decline">Cancel</button><button id="confirm" class="primary">Codes match</button></div>
</dialog>
<script>
const get = id => document.getElementById(id);
const hide = (id, value) => { get(id).hidden = value; };
const classicNames = {inbox:'Bluetooth Test', video:'VideoStream', stream:'Stream', youtubeAudio:'YouTube Audio', youtubeVideo:'YouTube Streamer'};
let tab = 'inbox', state = {}, pending = false, deviceList = '', initialized = false;
const destination = () => tab === 'inbox' ? get('destination').value : tab;
const video = () => ['video','youtubeVideo'].includes(destination());
const youtube = () => ['youtubeAudio','youtubeVideo'].includes(tab);
function settings() {
  return {destination:destination(), address:get('address').value, audio:get('audio').value,
    quality:get('quality').value, fps:Number(get('fps').value), playback:get('playback').value,
    convert:get('convert').checked, transport:get('transport').value, autoplay:get('autoplay').checked};
}
function showError(message='') {
  get('error').textContent = message;
  hide('error', !message);
}
async function post(action, extra={}) {
  const response = await fetch('/api/' + action, {method:'POST',
    headers:{'Content-Type':'application/json','X-Nano-Request':'1'}, body:JSON.stringify({...settings(),...extra})});
  const data = await response.json();
  if (!response.ok) throw Error(data.error);
}
async function act(action, extra={}) {
  showError();
  pending = true;
  render();
  try { await post(action, extra); }
  catch (e) { showError(e.message); }
  finally { pending = false; await poll(); }
}
function render() {
  const ble = tab === 'ble', connected = state.connected === destination();
  const ready = ble ? state.bleReady : connected && !state.reconnect;
  hide('connection', ble);
  hide('ble-connection', !ble);
  hide('destination-row', tab !== 'inbox');
  hide('quality-row', !video());
  hide('fps-row', !video());
  hide('convert-row', !video());
  hide('playback-row', !video() && tab !== 'stream');
  hide('transport-row', !ble);
  hide('autoplay-row', !ble);
  hide('search-form', !youtube());
  hide('link-form', !youtube() && tab !== 'stream');
  get('file').accept = video() ? 'video/*,.mp4,.mov,.mkv' : 'audio/*,.wav,.mp3,.m4a,.aiff,.flac,.ogg';
  for (const id of ['fullMono','fullStereo']) {
    get('audio').querySelector('option[value="' + id + '"]').disabled = ble;
  }
  get('hint').textContent = (state.pi ? 'Pi address ' + state.pi + '. ' : '') +
    (state.reconnect ? 'To send another file, start listening again on the Nano and reconnect.' :
     'Open ' + classicNames[destination()] + ' on the Nano and listen for this sender.');
  get('ble-hint').textContent = state.bleReady ? 'Nano subscribed. Ready to send.' :
    'In Bluetooth Test, scan for Nano UART and connect.';
  for (const id of ['scan','pair','connect']) get(id).disabled = pending || state.busy;
  for (const id of ['send-file','send-link','search','send-message']) get(id).disabled = pending || state.busy || !ready;
  get('disconnect').disabled = !state.connected;
  hide('cancel', !state.busy);
  get('status').textContent = pending ? 'Working…' : state.status || 'Connecting to the Pi…';
  hide('progress', state.progress == null);
  get('progress').value = state.progress || 0;
  const devices = JSON.stringify(state.devices || []);
  if (devices !== deviceList) {
    deviceList = devices;
    const selected = get('devices').value;
    get('devices').replaceChildren(new Option('Select a device',''),
      ...(state.devices || []).map(d => new Option(d.name + ' · ' + d.address + (d.paired ? ' · Paired' : ''),d.address)));
    get('devices').value = selected;
  }
  const dialog = get('pair-dialog');
  if (state.pairCode) {
    get('code').textContent = state.pairCode;
    if (!dialog.open) dialog.showModal();
  } else if (dialog.open) dialog.close();
}
async function poll() {
  try {
    const response = await fetch('/state', {cache:'no-store'});
    const next = await response.json();
    if (!response.ok) throw Error(next.error);
    state = next;
    if (!initialized) {
      if (!get('address').value) get('address').value = state.saved || '';
      initialized = true;
      if (state.radioError) showError(state.radioError);
    }
    render();
  } catch (e) { showError(e.message); }
}
get('tabs').addEventListener('click', e => {
  const next = e.target.dataset.tab;
  if (!next || tab === next || pending || state.busy) return;
  const changeRadioMode = tab === 'ble' || next === 'ble';
  tab = next;
  get('file').value = '';
  if (tab === 'ble' && !['low','medium','high'].includes(get('audio').value)) get('audio').value = 'high';
  for (const button of get('tabs').querySelectorAll('button')) button.setAttribute('aria-selected', button.dataset.tab === tab);
  render();
  if (changeRadioMode) act('mode');
});
get('destination').onchange = () => { get('file').value = ''; render(); };
get('devices').onchange = () => { if (get('devices').value) get('address').value = get('devices').value; };
for (const id of ['audio','quality','fps','playback','convert']) get(id).onchange = () =>
  post('settings').catch(e => showError(e.message));
for (const id of ['scan','pair','connect','disconnect','cancel']) get(id).onclick = () => act(id);
get('confirm').onclick = () => post('confirm',{accept:true}).catch(e => showError(e.message));
get('decline').onclick = () => post('confirm',{accept:false}).catch(e => showError(e.message));
get('pair-dialog').oncancel = e => { e.preventDefault(); get('decline').click(); };
get('send-message').onclick = () => act('message',{value:get('message').value});
get('search-form').onsubmit = e => { e.preventDefault(); act('search',{value:get('query').value}); };
get('link-form').onsubmit = e => { e.preventDefault(); act('link',{value:get('link').value}); };
get('file-form').onsubmit = async e => {
  e.preventDefault();
  const file = get('file').files[0];
  if (!file) return;
  showError();
  pending = true;
  render();
  try {
    const query = new URLSearchParams({name:file.name,settings:JSON.stringify(settings())});
    const response = await fetch('/upload?' + query,{method:'POST',headers:{'X-Nano-Request':'1'},body:file});
    const data = await response.json();
    if (!response.ok) throw Error(data.error);
  } catch(e) { showError(e.message); }
  finally { pending = false; await poll(); }
};
poll();
setInterval(poll, 1000);
</script>
</body>
</html>
