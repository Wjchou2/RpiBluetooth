<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nano Bluetooth Link</title>
<style>
:root { color-scheme: light; font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #192333; background: #edf1f7; }
* { box-sizing: border-box; }
body { margin: 0; }
main { max-width: 860px; margin: 0 auto; padding: 48px 24px; }
header { display: flex; gap: 14px; align-items: center; margin-bottom: 28px; }
summary { cursor: pointer; font-weight: 600; }
details > .grid { margin-top: 13px; }
.mark { background: #174fc3; color: white; border-radius: 12px; width: 38px; height: 46px; display: grid; place-items: center; }
.mark::before { content: ""; width: 18px; height: 29px; border: 2px solid white; border-radius: 4px; }
h1 { margin: 0; font-size: 28px; letter-spacing: -.045em; }
h2 { margin: 0 0 16px; font-size: 17px; letter-spacing: -.02em; }
nav { display: flex; gap: 4px; overflow: auto; padding: 5px; border-radius: 11px; background: #dfe6f1; margin-bottom: 16px; }
button, input, select { font: inherit; }
button { cursor: pointer; border: 1px solid #cdd7e7; border-radius: 8px; padding: 9px 13px; background: #f7f9fd; color: #192333; white-space: nowrap; }
button:hover:not(:disabled) { background: #e6efff; }
button:disabled { opacity: .47; cursor: default; }
button.primary { color: white; background: #174fc3; border-color: #174fc3; }
button.primary:hover:not(:disabled) { background: #15429b; }
nav button { border: 0; background: transparent; }
nav button[aria-selected="true"] { background: white; color: #1647a9; box-shadow: 0 1px 3px #19376323; }
section { margin-bottom: 12px; border: 1px solid #dbe3ef; border-radius: 14px; background: white; padding: 20px; }
label { display: grid; gap: 7px; color: #495976; font-size: 14px; }
input:not([type=checkbox]), select { width: 100%; border-radius: 8px; border: 1px solid #cdd7e7; padding: 9px 10px; background: #fff; color: #192333; min-width: 0; }
input[type=checkbox] { accent-color: #174fc3; }
.grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 14px; }
.row { display: flex; align-items: end; flex-wrap: wrap; gap: 8px; margin-top: 13px; }
.row label { flex: 1 1 170px; }
.check { display: flex; align-items: center; }
.hint { color: #495976; font-size: 14px; line-height: 1.4; margin: 10px 0 0; }
.status { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
#status { margin: 0; overflow-wrap: anywhere; }
#error { color: #9b2531; }
progress { width: 100%; height: 8px; accent-color: #174fc3; margin-top: 12px; }
dialog { border: 1px solid #cdd7e7; border-radius: 14px; padding: 24px; max-width: min(380px,90vw); }
dialog::backdrop { background: #17263a88; }
#code { font-size: 35px; font-variant-numeric: tabular-nums; letter-spacing: .15em; margin: 14px 0; }
[hidden] { display: none !important; }
@media(max-width: 530px) { main { padding: 25px 12px; } section { padding: 15px; } .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
<header><span class="mark" aria-hidden="true"></span><h1>Nano Bluetooth Link</h1></header>
<nav id="tabs" aria-label="Transfer modes" role="tablist">
<button type="button" role="tab" data-tab="ble" aria-selected="false">BLE</button>
<button type="button" role="tab" data-tab="youtubeAudio" aria-selected="true">YT Music</button>
<button type="button" role="tab" data-tab="youtubeVideo" aria-selected="false">YT Video</button>
</nav>
<section id="connection">
<details id="device-setup">
<summary>Device Setup</summary>
<p class="hint" id="discovery-hint"></p>
<div class="grid">
<label>Nearby devices<select id="devices"><option value="">Choose Device</option></select></label>
<label>Nano Bluetooth address<input id="address" autocomplete="off" placeholder="AA:BB:CC:DD:EE:FF"></label>
</div>
<div class="row">
<button id="scan">Find Devices</button><button id="stop-scan" hidden>Stop Search</button>
<button id="pair">Pair</button>
</div>
<p id="scan-result" class="hint" hidden></p>
</details>
<div class="row">
<button id="connect" class="primary">Connect</button><button id="disconnect" hidden>Disconnect</button>
<button id="stop-pair" hidden>Stop Waiting</button>
</div>
<p class="hint" id="hint"></p>
</section>
<section id="ble-connection" hidden>
<p id="ble-hint" class="hint"></p>
<form id="message-form" class="row">
<label>Message<input id="message" maxlength="20" value="Hello" required></label>
<button id="send-message">Send</button>
</form>
<p id="received-row" class="hint" hidden>From Nano: <output id="received"></output></p>
</section>
<section id="media">
<form id="search-form" class="row"><label><span id="search-label">Search YouTube Music</span><input id="query" maxlength="200" required></label><button id="search">Search</button></form>
<p id="search-hint" class="hint"></p>
<form id="link-form" class="row"><label>YouTube link<input id="link" placeholder="https://youtu.be/…" required></label><button id="send-link">Send Link</button></form>
<div class="row grid">
<label id="playback-row">Start playback<select id="playback"><option value="after">After Transfer</option><option value="live">While Sending</option><option value="test">Receive Test</option></select></label>
<label>Audio quality<select id="audio"><option value="low">Low (7.35 kHz)</option><option value="medium">Medium (11.025 kHz)</option><option value="high">High (22.05 kHz)</option><option value="fullMono">Full (44.1 kHz mono)</option><option value="fullStereo">Full (44.1 kHz stereo)</option></select></label>
<label id="quality-row" hidden>Video quality<select id="quality"><option value="double">128 × 72 · Double</option><option value="compact">192 × 112</option><option value="medium">256 × 144</option><option value="large">320 × 176</option><option value="native">432 × 240</option></select></label>
<label id="fps-row" hidden>Frame rate<select id="fps"><option value="5">5 fps</option><option value="10">10 fps</option><option value="15">15 fps</option><option value="22">22 fps</option><option value="30">30 fps</option></select></label>
<label id="transport-row" hidden>Audio transport<select id="transport"><option value="read">GATT Read</option><option value="notify">Notifications</option><option value="fast">Fast Notifications</option></select></label>
<label id="convert-row" class="check" hidden><input type="checkbox" id="convert"> Convert during transfer</label>
<label id="download-row" class="check"><input type="checkbox" id="download"> Download during transfer</label>
<label id="autoplay-row" class="check" hidden><input type="checkbox" id="autoplay"> Start playing on receive</label>
</div>
<p id="media-hint" class="hint"></p>
<form id="file-form" class="row"><label>File<input type="file" id="file" required></label><button id="send-file" class="primary">Send File</button></form>
</section>
<section>
<div class="status"><p id="status" role="status">Starting Nano Bluetooth Link…</p><button id="cancel" hidden>Cancel</button></div>
<progress id="progress" max="100" hidden></progress>
<p id="error" class="hint" role="alert" hidden></p>
</section>
</main>
<dialog id="pair-dialog">
<h2>Confirm Bluetooth pairing</h2>
<p class="hint">Check that this code matches the one on the Nano.</p>
<p id="code"></p>
<div class="row"><button id="decline">Cancel</button><button id="confirm" class="primary">Codes match</button></div>
</dialog>
<script>
const get = id => document.getElementById(id);
const hide = (id, value) => { get(id).hidden = value; };
const set = (id, text) => { get(id).textContent = text; };
const modes = {
  youtubeAudio: {query: '', link: ''},
  youtubeVideo: {query: '', link: ''},
  ble: {audio: 'high', transport: 'read', autoplay: false}
};
let tab = 'youtubeAudio', state = {}, pending = '', devicesJSON = '', initialized = false, polling = false;
const isVideo = () => tab === 'youtubeVideo';
const isBLE = () => tab === 'ble';
function fps() {
  const options = modes[tab];
  return isVideo() && options.quality === 'native' && (state.videoRevision || 0) < 6 &&
    options.fps !== 22 ? 30 : options.fps;
}
function settings() {
  const {query, link, ...options} = modes[tab];
  return {...options, destination: tab, address: get('address').value};
}
function showError(message='') {
  set('error', message);
  hide('error', !message);
}
async function post(action, extra={}) {
  const response = await fetch('/api/' + action, {method: 'POST',
    headers: {'Content-Type': 'application/json', 'X-Nano-Request': '1'},
    body: JSON.stringify({...settings(), ...extra})});
  const data = await response.json();
  if (!response.ok) throw Error(data.error);
}
async function act(action, extra={}) {
  showError();
  pending = action;
  render();
  try { await post(action, extra); }
  catch (error) { showError(error.message); }
  finally { pending = ''; await poll(); render(); }
}
function control(action, extra={}) {
  return post(action, extra).catch(error => showError(error.message));
}

function loadOptions() {
  for (const [id, value] of Object.entries(modes[tab])) {
    const input = get(id);
    if (input.type === 'checkbox') input.checked = value;
    else input.value = value;
  }
}
function render() {
  const ble = isBLE(), video = isVideo(), options = modes[tab], live = options.playback === 'live';
  const connected = state.connected === tab;
  const busy = Boolean(pending || state.busy);
  const ready = ble ? state.bleReady : connected && !state.waitingForVideo;
  const audioReady = ready && (!ble || options.transport !== 'read' || state.bleReadReady);
  const scanActive = state.scanning || pending === 'scan';
  const pairing = state.pairing || pending === 'pair' || pending === 'connect';

  hide('connection', ble);
  hide('ble-connection', !ble);
  for (const id of ['search-form', 'search-hint', 'link-form', 'playback-row', 'download-row']) hide(id, ble);
  for (const id of ['quality-row', 'fps-row', 'convert-row']) hide(id, !video);
  for (const id of ['transport-row', 'autoplay-row']) hide(id, !ble);
  get('download').disabled = !live || busy;
  get('convert').disabled = !initialized || busy;
  get('audio').disabled = !initialized || busy;
  get('quality').disabled = !initialized || busy;
  get('fps').disabled = !initialized || busy;
  get('playback').disabled = !initialized || busy;
  get('autoplay').disabled = busy;
  get('transport').disabled = busy;
  const receiveTest = get('playback').querySelector('[value=test]');
  receiveTest.hidden = receiveTest.disabled = video;
  for (const option of get('audio').options) {
    option.hidden = option.disabled = ble && option.value.startsWith('full');
  }
  const nativeLimited = video && options.quality === 'native' && (state.videoRevision || 0) < 6;
  for (const option of get('fps').options) {
    option.hidden = option.disabled = nativeLimited && Number(option.value) < 22;
  }
  if (video) get('fps').value = nativeLimited && options.fps < 22 ? 30 : options.fps;
  get('file').accept = video ? 'video/*,.mp4,.mov,.mkv' : 'audio/*,.wav,.mp3,.m4a,.aiff,.flac,.ogg';

  hide('scan', scanActive);
  hide('stop-scan', !scanActive);
  hide('connect', connected || pairing);
  hide('disconnect', !connected || pairing);
  hide('stop-pair', !state.pairing);
  get('scan').disabled = busy || Boolean(state.connected) || pairing;
  const peer = get('address').value.trim().toUpperCase().replaceAll('-', ':');
  const repairing = peer && peer === state.bondToRepair;
  set('pair', repairing ? 'Pair again' : 'Pair');
  get('pair').disabled = busy || Boolean(state.connected) || pairing || !get('address').value.trim();
  get('connect').disabled = !initialized || busy || scanActive || !get('address').value.trim();
  get('message').disabled = busy;
  get('message').maxLength = state.bleLimit || 20;
  get('send-message').disabled = busy || !ready || !get('message').value.trim();
  get('send-file').disabled = busy || !audioReady;
  set('send-file', ble ? 'Send Audio' : 'Send File');
  get('send-link').disabled = busy || !ready || !get('link').value.trim();
  get('search').disabled = busy || !ready || !get('query').value.trim();
  hide('cancel', !state.busy);
  const app = video ? 'YT Video' : 'YT Music';
  set('discovery-hint', repairing ? 'Forget the Pi in the Nano’s Bluetooth settings and keep that screen open while pairing.' :
    state.radioError || (state.pi ? 'On the Nano use Find Mac, or enter ' + state.pi + ' under Mac Address.' : 'Starting Bluetooth…'));
  set('hint', state.waitingForVideo && connected ? 'Close playback on the Nano before sending another video.' :
    state.autoConnect && state.saved ? 'Open ' + app + ' on the Nano and start listening. The Pi connects automatically.' :
    'Open ' + app + ' on the Nano and start listening. Choose the Nano under Device Setup.');
  set('ble-hint', state.radioError || (state.bleReady ?
    (audioReady ? 'Connected. Audio clips can be up to 30 seconds.' : 'Connected. Waiting for the Nano to start GATT reads.') :
    'In BLE Chat or Bluetooth Test, connect to Nano Bluetooth Link.'));
  set('received', state.receivedMessage || '');
  hide('received-row', !state.receivedMessage);
  set('search-label', video ? 'Search YouTube' : 'Search YouTube Music');
  set('search-hint', 'Search here or on the Nano, then pick a ' + (video ? 'video' : 'song') + ' on the Nano.');
  let hint = '';
  if (video && connected && fps() === 22 && state.videoRevision < 4) {
    hint = 'Update YT Video on the Nano to use 22 fps.';
  } else if (video && connected && options.quality !== 'double' &&
    state.videoRevision < (options.quality === 'native' ? 2 : 3)) {
    hint = 'Update YT Video on the Nano to use this preset.';
  } else if (!ble && live && options.download) {
    hint = !video && connected && state.audioRevision < 6 ? 'Update YT Music on the Nano to use Download during transfer.' :
      'YouTube links and search results convert as they download.';
  }
  set('media-hint', hint);
  hide('media-hint', !hint);
  set('status', state.scanning ? 'Searching for nearby Classic devices…' : state.status || 'Starting Bluetooth…');
  hide('progress', state.progress == null && !state.busy);
  if (state.progress == null) get('progress').removeAttribute('value');
  else get('progress').value = state.progress;

  const devices = state.devices || [];
  const listing = JSON.stringify(devices);
  if (listing !== devicesJSON) {
    devicesJSON = listing;
    const selected = get('devices').value;
    get('devices').replaceChildren(new Option('Choose Device',''),
      ...devices.map(device => new Option(device.name + ' (' + device.address + ')' +
        (device.paired ? ' · Paired' : ''), device.address)));
    get('devices').value = selected;
  }
  const dialog = get('pair-dialog');
  if (state.pairCode) {
    set('code', state.pairCode);
    if (!dialog.open) dialog.showModal();
  } else if (dialog.open) dialog.close();
}

async function poll() {
  if (polling) return;
  polling = true;
  try {
    const response = await fetch('/state', {cache: 'no-store'});
    const next = await response.json();
    if (!response.ok) throw Error(next.error);
    state = next;
    if (!initialized) {
      if (!get('address').value) get('address').value = state.saved || '';
      for (const mode of ['youtubeAudio', 'youtubeVideo']) {
        Object.assign(modes[mode], state.settings[mode]);
      }
      loadOptions();
      initialized = true;
      // A reload returns to YT Music and resumes its Classic discovery beacon.
      await control('mode');
    }
    render();
  } catch (error) { showError(error.message); }
  finally { polling = false; }
}
get('tabs').addEventListener('click', async event => {
  const next = event.target.dataset.tab;
  if (!initialized || !next || next === tab || pending || state.busy || state.scanning || state.pairing) return;
  const changeAdvertising = isBLE() || next === 'ble';
  tab = next;
  loadOptions();
  showError();
  get('file').value = '';
  for (const button of get('tabs').querySelectorAll('button')) button.setAttribute('aria-selected', button.dataset.tab === tab);
  render();
  if (changeAdvertising) await act('mode');
});
get('devices').onchange = () => {
  if (get('devices').value) get('address').value = get('devices').value;
  render();
};
get('address').oninput = render;
get('message').oninput = render;
for (const id of ['query', 'link']) {
  get(id).oninput = () => { modes[tab][id] = get(id).value; render(); };
}
for (const id of ['audio', 'quality', 'fps', 'playback', 'convert', 'download', 'transport', 'autoplay']) {
  get(id).onchange = () => {
    const field = get(id);
    const mode = modes[tab];
    mode[id] = field.type === 'checkbox' ? field.checked : id === 'fps' ? Number(field.value) : field.value;
    if (!isBLE() && initialized) control('settings');
    render();
  };
}
get('scan').onclick = async () => {
  hide('scan-result', true);
  await act('scan');
  if (!(state.devices || []).length) {
    set('scan-result', 'No Classic devices found. Keep Bluetooth settings open on the Nano, or enter its Bluetooth address.');
    hide('scan-result', false);
  }
};
get('stop-scan').onclick = () => control('stopScan');
get('stop-pair').onclick = () => control('stopPair');
get('pair').onclick = () => act('pair');
get('connect').onclick = () => act('connect');
get('disconnect').onclick = () => act('disconnect');
get('cancel').onclick = () => control('cancel');
get('confirm').onclick = () => control('confirm', {accept: true});
get('decline').onclick = () => control('confirm', {accept: false});
get('pair-dialog').oncancel = event => { event.preventDefault(); get('decline').click(); };
get('message-form').onsubmit = event => { event.preventDefault(); act('message', {value: get('message').value}); };
get('search-form').onsubmit = event => { event.preventDefault(); act('search', {value: get('query').value}); };
get('link-form').onsubmit = event => { event.preventDefault(); act('link', {value: get('link').value}); };
get('file-form').onsubmit = async event => {
  event.preventDefault();
  const file = get('file').files[0];
  if (!file) return;
  showError();
  pending = 'upload';
  render();
  try {
    const query = new URLSearchParams({name: file.name, settings: JSON.stringify(settings())});
    const response = await fetch('/upload?' + query, {method: 'POST', headers: {'X-Nano-Request': '1'}, body: file});
    const data = await response.json();
    if (!response.ok) throw Error(data.error);
    get('file').value = '';
  } catch (error) { showError(error.message); }
  finally { pending = ''; await poll(); render(); }
};
loadOptions();
render();
poll();
setInterval(poll, 1000);
</script>
</body>
</html>
